name: Browser build
on:
  workflow_dispatch:
  push:
    branches: [wasm-upstream, release/svn-multiplatform]
  pull_request:
    paths:
      - 'src/**'
      - 'web/**'
      - 'cmake/wasm.cmake'
      - 'CMakeLists.txt'
      - '.github/workflows/wasm.yml'

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.14
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.14
      - name: Build
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          python3 tools/package_svn.py build-wasm/campaigns/SVN
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j2
      - uses: actions/upload-artifact@v4
        with:
          name: f15se2-browser
          path: |
            build-wasm/index.html
            build-wasm/launcher.js
            build-wasm/f15se2-ex.js
            build-wasm/f15se2-ex.wasm
            build-wasm/f15se2-ex.data
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == 'release/svn-multiplatform'
        with:
          path: build-wasm/site

  deploy:
    if: github.ref_name == 'release/svn-multiplatform'
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
