name: CI

on:
  push:
    branches: [master, main, 'feature/**']
  pull_request:
    branches: [master, main, 'feature/**']

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            configure: cmake -S . -B build
            build: cmake --build build -j$(nproc)
            test: ctest --test-dir build --output-on-failure

          - name: Windows MSVC x64
            os: windows-latest
            configure: cmake -S . -B build -G "Visual Studio 18 2026" -A x64
            build: cmake --build build --config Release --parallel
            test: ctest --test-dir build -C Release --output-on-failure

          - name: macOS Clang
            os: macos-latest
            configure: cmake -S . -B build
            build: cmake --build build -j$(sysctl -n hw.ncpu)
            test: ctest --test-dir build --output-on-failure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev

      - name: Configure CMake
        run: ${{ matrix.configure }}

      - name: Build
        run: ${{ matrix.build }}

      - name: Test
        run: ${{ matrix.test }}

  lint:
    name: Lint (clang-format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the check diffs formatting against a base commit.
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          clang-format --version

      # Only lines changed vs the base are checked — a whole-tree pass would
      # drown the signal in legacy violations on files nobody touched.
      - name: Resolve diff base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              BASE="$BEFORE"
            else
              # Branch-creation push: diff against the default branch's merge base.
              git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
              BASE=$(git merge-base HEAD "origin/${{ github.event.repository.default_branch }}")
            fi
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Check formatting of changed lines
        run: |
          set -o pipefail
          git clang-format --diff "${{ steps.base.outputs.base }}" \
              --extensions c,h,cpp,hpp | tee /tmp/clang-format.diff
          if grep -qE '^[+-][^+-]' /tmp/clang-format.diff; then
            echo "::error title=clang-format::Changed lines violate .clang-format — run 'git clang-format ${{ steps.base.outputs.base }}' and commit the result"
            exit 1
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake gcovr \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev

      - name: Configure CMake (coverage)
        run: cmake -S . -B build -DCOVERAGE=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests + generate coverage report
        run: cmake --build build --target coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage.xml
          # Public repo: tokenless upload is fine. Never fail CI if the upload
          # is rate-limited or the service is down.
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
