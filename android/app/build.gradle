plugins {
    id "com.android.application"
}

android {
    namespace "org.f15se2.ex"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "org.f15se2.ex"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "0.1"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static"
                abiFilters "arm64-v8a"
            }
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }

    /*
     * Optional local testing bundle. Original game data is copyrighted and must
     * never be committed, but a developer who owns it can embed a temporary copy:
     *
     * F15_ANDROID_GAME_ASSETS=/path/to/game gradle -p android assembleDebug
     */
    def gameAssets = providers.environmentVariable("F15_ANDROID_GAME_ASSETS")
    if (gameAssets.isPresent()) {
        sourceSets.main.assets.srcDir(layout.buildDirectory.dir("generated/game-assets"))
        tasks.register("stageGameAssets", Sync) {
            from(gameAssets.get())
            into(layout.buildDirectory.dir("generated/game-assets/game"))
        }
        preBuild.dependsOn("stageGameAssets")
    }
}

dependencies {
    implementation files("libs/SDL3-3.4.10.aar")
}
